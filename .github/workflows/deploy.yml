name: Deploy — Production (PM2)

on:
  push:
    branches: [main]
  # Can also be triggered manually from the GitHub Actions UI
  workflow_dispatch:

# Only run one deploy at a time — cancel older in-progress deploys if new push arrives
concurrency:
  group: deploy-production
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy to College Server
    # ⚠️  MUST be self-hosted — the college server is on a private LAN (192.168.x.x)
    # that GitHub's cloud runners cannot reach. The self-hosted runner runs ON the
    # college server and polls GitHub for jobs, so no inbound connection is needed.
    runs-on: self-hosted

    steps:
      - name: Checkout latest code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: client-next/package-lock.json

      - name: Install dependencies
        working-directory: client-next
        run: npm install

      - name: Build Next.js
        working-directory: client-next
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          NEXT_PUBLIC_APP_URL: ${{ secrets.NEXT_PUBLIC_APP_URL }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          ALERT_RECIPIENTS: ${{ secrets.ALERT_RECIPIENTS }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}

      - name: Restart PM2
        run: |
          pm2 restart cipd || pm2 start npm --name "cipd" -- start
          pm2 save
          echo "✅ Deploy complete — $(date)"
